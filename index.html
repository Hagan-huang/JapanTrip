<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" href="images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KANSAI 2027">
<title>京都・大阪 9 天 8 夜｜2027.1.13–1.21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&family=Zen+Antique&family=Shippori+Mincho:wght@500;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060f; --bg2:#100c22; --panel:#130e2a; --line:#2a2150;
  --pink:#ff2a6d; --cyan:#05d9e8; --purple:#b967ff; --yellow:#f9f871; --green:#3dff9a; --orange:#ff9a3c;
  --text:#e9e6ff; --dim:#8f88b8;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --disp:"Orbitron","Noto Sans TC",sans-serif;
  --body:"Noto Sans TC",system-ui,sans-serif;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:20px}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 20% -10%,#2a0f45 0,transparent 55%),radial-gradient(ellipse at 110% 30%,#062c3a 0,transparent 45%);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
button,input,select{font:inherit;color:inherit}
a{color:var(--cyan)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(7,6,15,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;height:56px}
.logo{font-family:var(--disp);font-weight:900;font-size:13px;letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 8px var(--cyan);white-space:nowrap;margin-right:auto}
.logo b{color:var(--pink);text-shadow:0 0 8px var(--pink)}
nav{display:flex;gap:4px}
nav a{font-size:13px;font-weight:700;text-decoration:none;color:var(--dim);padding:6px 10px;border:1px solid transparent;border-radius:999px;transition:.25s}
nav a.on{color:#fff;border-color:var(--pink);background:rgba(255,42,109,.15);box-shadow:0 0 10px rgba(255,42,109,.6),inset 0 0 8px rgba(255,42,109,.35)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#heroArt{position:relative;width:100%;aspect-ratio:400/320;max-height:68vh}
#heroArt svg,#heroArt img{position:absolute;inset:0;width:100%;height:100%}
#heroArt img{object-fit:cover}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .shade{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,transparent,rgba(7,6,15,.7) 45%,var(--bg) 78%);pointer-events:none}
.hero .txt{position:relative;margin-top:-64px;text-align:center;padding:0 16px 30px}
.code{font-family:var(--disp);font-size:12px;letter-spacing:.35em;color:var(--cyan);text-shadow:0 0 6px var(--cyan)}
.glitch{position:relative;display:inline-block;font-weight:900;font-size:clamp(30px,9vw,44px);letter-spacing:.06em;margin:6px 0 4px;color:#fff;text-shadow:0 0 12px rgba(255,42,109,.9),0 0 30px rgba(255,42,109,.5)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0}
.glitch::before{color:var(--cyan);transform:translate(-2px,0);clip-path:inset(0 0 60% 0);animation:gl1 3.2s infinite steps(1)}
.glitch::after{color:var(--pink);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl2 2.7s infinite steps(1)}
@keyframes gl1{0%,88%,100%{transform:translate(0);opacity:0}89%{transform:translate(-4px,-1px);opacity:.9}93%{transform:translate(3px,1px);opacity:.9}}
@keyframes gl2{0%,80%,100%{transform:translate(0);opacity:0}81%{transform:translate(4px,1px);opacity:.9}85%{transform:translate(-3px,0);opacity:.9}}
.range{font-family:var(--mono);color:var(--dim);font-size:13px}
.count{display:inline-flex;align-items:baseline;gap:6px;margin-top:14px;padding:8px 18px;border:1.5px solid var(--yellow);color:var(--yellow);font-weight:700;clip-path:var(--cut);background:rgba(249,248,113,.08);box-shadow:inset 0 0 14px rgba(249,248,113,.25)}
.count b{font-family:var(--disp);font-size:26px;text-shadow:0 0 10px var(--yellow)}
.flick{animation:flick 4s infinite}
.flick2{animation:flick 5.5s infinite 1.3s}
.flick3{animation:flick 3.3s infinite .7s}
@keyframes flick{0%,19%,21%,23%,55%,57%,100%{opacity:1}20%,22%,56%{opacity:.25}}

/* ---------- section ---------- */
section{padding:34px 0 10px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sh .ic{width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(5,217,232,.5);clip-path:var(--cut)}
.sh h2{font-size:21px;font-weight:900;letter-spacing:.05em}
.sh small{font-family:var(--disp);font-size:10px;color:var(--pink);letter-spacing:.25em;margin-left:auto}

.card{position:relative;background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);clip-path:var(--cut);padding:14px 16px;margin-bottom:12px}
.card.glow{border-color:var(--c,var(--cyan));box-shadow:inset 0 0 18px color-mix(in srgb,var(--c,var(--cyan)) 18%,transparent)}

/* ---------- flights ---------- */
.fl{--c:var(--cyan)}
.fl .top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--c);letter-spacing:.04em;margin-bottom:8px}
.fl .row{display:flex;align-items:center;gap:12px}
.fl .row>div:first-child,.fl .end{flex:none}
.fl .t{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1;letter-spacing:.02em}
.fl .p{font-size:12px;color:var(--dim);margin-top:6px;white-space:nowrap}
.fl .mid{flex:1;min-width:60px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);position:relative}
.fl .mid::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--c);opacity:.6}
.fl .mid span{position:relative;background:var(--panel);padding:0 6px}
.fl .end{text-align:right}
.fl .nt{font-size:12px;color:var(--pink);margin-top:8px}

/* ---------- day rail ---------- */
.rail{position:relative;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.rail::-webkit-scrollbar{display:none}
.rail-in{position:relative;display:flex;width:max-content;padding:6px 4px 4px}
.rail-in::before{content:"";position:absolute;left:30px;right:30px;top:20px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));box-shadow:0 0 8px var(--purple)}
.dt{position:relative;width:64px;flex:none;background:none;border:0;text-align:center;cursor:pointer;padding-top:24px}
.dt::before{content:"";position:absolute;top:8px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--bg);border:2px solid var(--dim);transition:.3s}
.dt .d{display:block;font-family:var(--disp);font-size:14px;font-weight:700;color:var(--dim);transition:.3s;padding:2px 0;border-radius:999px}
.dt .w{font-size:11px;color:var(--dim)}
.dt.on::before{border-color:var(--pink);background:var(--pink);box-shadow:0 0 10px var(--pink)}
.dt.on .d{color:#fff;background:rgba(255,42,109,.2);box-shadow:0 0 10px rgba(255,42,109,.5)}
/* ---------- day card ---------- */
.dcard{--c:var(--cyan);display:flex;gap:14px;align-items:center;margin-top:12px;animation:in .45s ease}
.dcard .art{flex:none;width:72px;height:72px;display:grid;place-items:center;border:1.5px solid var(--c);clip-path:var(--cut);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.dcard .k{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:var(--c)}
.dcard h3{font-size:18px;font-weight:900;line-height:1.3;margin:2px 0}
.dcard .s{font-size:12px;color:var(--dim)}
.pp{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;border:1px solid var(--yellow);color:var(--yellow);border-radius:999px;margin-left:6px;vertical-align:2px;font-style:normal;line-height:1.6}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- timeline ---------- */
.tl{position:relative;margin:18px 0 0 56px;padding-bottom:6px}
.tl::before{content:"";position:absolute;left:0;top:6px;bottom:0;border-left:2px dotted var(--purple);opacity:.7}
.it{position:relative;padding:0 0 16px 18px;animation:in .45s ease backwards}
.it::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan);box-shadow:0 0 6px var(--cyan)}
.it .tm{position:absolute;left:-58px;top:2px;width:46px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--dim)}
.it.t-move::before{border-color:var(--purple);box-shadow:0 0 6px var(--purple)}
.it.t-food::before{border-color:var(--orange);box-shadow:0 0 6px var(--orange)}
.it.t-note::before{border-color:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.mv{font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border:1px solid var(--tc,var(--cyan));color:var(--tc,var(--cyan));border-radius:999px;margin-right:6px;vertical-align:1px;background:color-mix(in srgb,var(--tc,var(--cyan)) 12%,transparent)}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
.spot{display:block;background:var(--panel);border:1px solid var(--line);padding:9px 12px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);text-decoration:none;color:var(--text);transition:.2s}
.spot:active{border-color:var(--cyan)}
.it.t-food .spot{border-left:3px solid var(--orange)}
.it.t-spot .spot{border-left:3px solid var(--cyan)}
.spot .n{font-weight:700}
.spot .m{float:right;font-size:11px;color:var(--cyan);font-family:var(--mono);margin-left:8px}
.close{display:inline-block;font-size:11px;font-weight:700;color:var(--pink);margin-top:4px}
.close::before{content:"⏱ "}
.tbd .spot,.tbd.t-note .mv{border:1px dashed var(--dim)!important;background:transparent;color:var(--dim);padding:8px 12px}
.tbdl{font-size:10px;font-weight:700;color:var(--bg);background:var(--dim);padding:0 6px;margin-right:6px;letter-spacing:.1em}
.notep{color:var(--yellow);font-size:14px}

/* ---------- checklists ---------- */
.ck h4{font-size:15px;margin-bottom:8px;color:var(--cyan)}
.ck label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.ck label:last-child{border:0}
.ck input{appearance:none;flex:none;width:20px;height:20px;border:1.5px solid var(--cyan);margin-top:1px;display:grid;place-items:center;transition:.2s}
.ck input:checked{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.ck input:checked::after{content:"✓";color:var(--bg);font-weight:900;font-size:14px}
.ck input:checked+span{text-decoration:line-through;color:var(--dim)}
.prog{font-family:var(--mono);font-size:11px;color:var(--dim);float:right}
.stay h4{font-size:16px}
.stay .dd{font-family:var(--mono);font-size:12px;color:var(--pink);float:right}
.stay p{font-size:13px;color:var(--dim);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--c,var(--cyan));color:var(--c,var(--cyan));background:color-mix(in srgb,var(--c,var(--cyan)) 10%,transparent);padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));text-decoration:none}
.btn:active{background:color-mix(in srgb,var(--c,var(--cyan)) 30%,transparent)}
.btn.pink{--c:var(--pink)}.btn.yel{--c:var(--yellow)}.btn.dim{--c:var(--dim)}
.btn.full{width:100%;padding:12px}
.btn.busy{opacity:.6;pointer-events:none}
.btn.busy::after{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.sm{padding:4px 10px;font-size:12px}

/* ---------- money ---------- */
.seg{display:flex;border:1px solid var(--line);margin-bottom:14px}
.seg button{flex:1;background:none;border:0;padding:10px 0;font-weight:700;color:var(--dim);cursor:pointer;font-size:14px}
.seg button.on{color:#fff;background:rgba(5,217,232,.12);box-shadow:inset 0 -2px 0 var(--cyan)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin-bottom:12px}
.who b{color:var(--yellow)}
.fld{margin-bottom:12px}
.fld>span{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);padding:10px 12px;outline:none;font-size:16px}
.in:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(5,217,232,.4)}
.amt{display:flex;gap:8px}
.amt .in:first-child{font-family:var(--disp);font-size:22px}
.amt select{width:96px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--dim)}
.chip.on{border-color:var(--pink);color:#fff;background:rgba(255,42,109,.18);box-shadow:0 0 8px rgba(255,42,109,.4)}
.tog{display:flex;gap:0;border:1.5px solid var(--purple);margin-bottom:14px}
.tog button{flex:1;padding:10px;background:none;border:0;font-weight:900;cursor:pointer;color:var(--dim)}
.tog button.on{background:var(--purple);color:var(--bg)}
.custom{display:grid;grid-template-columns:1fr 110px;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px}
.big{font-family:var(--disp);font-size:30px;font-weight:900;color:var(--cyan);text-shadow:0 0 12px var(--cyan);line-height:1.1}
.big small{font-size:14px;color:var(--dim);text-shadow:none;margin-left:6px;font-family:var(--body)}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));box-shadow:0 0 10px var(--purple);transition:width .6s}
.cat{display:grid;grid-template-columns:52px 1fr 86px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.cat .bar{margin:0;height:8px}
.cat .v{text-align:right;font-family:var(--mono);font-size:12px}
.dayh{font-family:var(--mono);font-size:12px;color:var(--pink);margin:14px 0 6px;display:flex;justify-content:space-between}
.rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rec .ci{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);font-size:14px}
.rec .rt{flex:1;min-width:0;font-size:14px}
.rec .rt small{display:block;font-size:11px;color:var(--dim)}
.rec .ra{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}
.rec .ra small{display:block;font-size:11px;color:var(--dim)}
.x{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:4px}
.pend{color:var(--yellow);font-size:10px;border:1px solid var(--yellow);padding:0 4px;margin-left:4px}
.bal{display:grid;grid-template-columns:1fr 80px 80px 84px;gap:4px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
.bal.h{color:var(--dim);font-size:11px}
.bal span:not(:first-child){text-align:right;font-family:var(--mono)}
.pos{color:var(--green)}.neg{color:var(--pink)}
.settle{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:6px 0;border:1px solid var(--green);background:rgba(61,255,154,.06);font-size:14px}
.settle b{font-family:var(--mono)}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:18px 0}
.status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.warn{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:var(--panel);border:1px solid var(--cyan);padding:10px 18px;font-size:14px;z-index:500;transition:.3s;box-shadow:0 0 16px rgba(5,217,232,.4);max-width:90vw;text-align:center;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
footer{text-align:center;color:var(--dim);font-size:12px;padding:30px 0 50px;font-family:var(--mono)}
.mt{margin-top:10px}.row2{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--dim);margin-top:6px}

/* ---------- anime touches ---------- */
.sh h2{font-style:italic;transform:skewX(-6deg);text-shadow:3px 3px 0 var(--pink),-1px -1px 0 #000}
.sh small{font-family:var(--body);font-weight:900;letter-spacing:.15em;font-size:11px;padding:2px 8px;background:var(--pink);color:var(--bg);transform:skewX(-12deg)}
.card{background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px),linear-gradient(160deg,var(--panel),var(--bg2));background-size:7px 7px,auto;background-position:right top,0 0}
.card::before{content:"";position:absolute;right:0;top:0;width:46%;height:60%;background:radial-gradient(circle at 100% 0,rgba(5,217,232,.10),transparent 70%);pointer-events:none}
.dcard h3{font-style:italic;text-shadow:2px 2px 0 color-mix(in srgb,var(--c) 70%,transparent)}
.glitch{font-style:italic;-webkit-text-stroke:1px rgba(255,255,255,.4);text-shadow:4px 4px 0 var(--pink),0 0 22px rgba(255,42,109,.7)}
#heroArt img{transform:scale(1.04);transition:transform .2s linear;will-change:transform}
.sunglow{position:absolute;left:69%;top:18%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,80,160,.45),transparent 62%);mix-blend-mode:screen;animation:pulse 3.6s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.speed{position:absolute;inset:0;pointer-events:none;opacity:.0;background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.18) 0 .6deg,transparent .6deg 7deg);mask:radial-gradient(circle at 50% 60%,transparent 30%,#000 75%);-webkit-mask:radial-gradient(circle at 50% 60%,transparent 30%,#000 75%)}
.speed.on{animation:speed .5s ease-out}
@keyframes speed{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* ---------- katana slash ---------- */
#dayView{position:relative;overflow-x:clip}
.page{overflow-x:hidden;overflow-x:clip}
html,body{overflow-x:hidden;max-width:100%}
.fx{position:absolute;left:0;right:0;top:0;height:150px;pointer-events:none;z-index:5;overflow:visible}
.fx .kat{position:absolute;right:-10px;top:50%;width:360px;height:auto;margin-top:-23px;transform-origin:92% 50%;opacity:0;filter:drop-shadow(0 0 8px rgba(5,217,232,.8)) drop-shadow(0 0 16px rgba(255,42,109,.5))}
.fx.go .kat{animation:swing .52s cubic-bezier(.7,0,.2,1) forwards}
@keyframes swing{0%{opacity:0;transform:rotate(62deg) translateX(30px)}12%{opacity:1}55%{opacity:1;transform:rotate(-38deg)}100%{opacity:0;transform:rotate(-52deg) translateX(-20px)}}
.fx svg.cut{position:absolute;inset:-10px 0;width:100%;height:calc(100% + 20px);overflow:visible}
.fx .cut line{stroke-dasharray:520;stroke-dashoffset:520;opacity:0}
.fx.go .cut line{animation:cut .55s ease-out .2s forwards}
@keyframes cut{0%{stroke-dashoffset:520;opacity:1;stroke-width:5}35%{stroke-dashoffset:0;opacity:1;stroke-width:5}100%{stroke-dashoffset:0;opacity:0;stroke-width:.5}}
.fx .flash{position:absolute;inset:-40px -16px;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.75),rgba(255,42,109,.25) 40%,transparent 70%);opacity:0}
.fx.go .flash{animation:flash .4s ease-out .27s}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.fx .zan{position:absolute;right:10px;top:4px;font-weight:900;font-size:38px;white-space:nowrap;color:#fff;font-style:italic;-webkit-text-stroke:2px var(--pink);text-shadow:4px 4px 0 var(--pink),0 0 20px var(--pink);opacity:0}
.fx.go .zan{animation:zanx .7s cubic-bezier(.2,1.6,.4,1) .28s}
@keyframes zanx{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}25%{opacity:1;transform:scale(1) rotate(-8deg)}75%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-8deg) translateY(-8px)}}
.half{position:absolute;margin:0!important;animation:none!important;z-index:4;pointer-events:none}
.half.a{clip-path:polygon(0 0,100% 0,100% 18%,0 86%);animation:ha .55s cubic-bezier(.5,0,.6,1) .3s forwards!important}
.half.b{clip-path:polygon(0 86%,100% 18%,100% 100%,0 100%);animation:hb .55s cubic-bezier(.5,0,.6,1) .3s forwards!important}
@keyframes ha{to{transform:translate(-26px,-22px) rotate(-3deg);opacity:0}}
@keyframes hb{to{transform:translate(26px,26px) rotate(3deg);opacity:0}}
.shake{animation:shake .3s ease .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
.dt .d{font-style:italic}

/* ---------- flight tabs & modal ---------- */
.ftabs{display:flex;gap:6px;margin-bottom:12px}
.ftabs button{flex:1;background:none;border:1px solid var(--line);color:var(--dim);padding:8px 0;font-family:var(--disp);font-weight:700;font-size:14px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));font-style:italic}
.ftabs button.on{color:var(--bg);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.ftabs button small{display:block;font-family:var(--body);font-size:10px;font-style:normal;font-weight:500}
.fl{cursor:pointer;transition:transform .15s}
.fl:active{transform:scale(.98)}
.fl .legs{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.fl .go{display:block;text-align:right;font-size:12px;color:var(--c);font-weight:700;margin-top:10px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--c) 35%,transparent)}
.retl{font-size:12px;color:var(--pink);font-weight:700;letter-spacing:.1em;margin:16px 0 8px}
.modal{position:fixed;inset:0;z-index:200;background:rgba(3,2,10,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:linear-gradient(170deg,#140d2c,#07060f);border-top:2px solid var(--cyan);box-shadow:0 -6px 30px rgba(5,217,232,.35);padding:16px 16px 28px;transform:translateY(40px);transition:transform .3s}
.modal.open .sheet{transform:none}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sheet .hd h3{font-size:18px;font-weight:900;font-style:italic}
.sheet .hd p{font-size:12px;color:var(--dim)}
.sheet .xx{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);width:32px;height:32px;font-size:16px;cursor:pointer;flex:none}
.map{position:relative;border:1px solid var(--line);background:#05040c;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.fst{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0 4px}
.fst b{color:var(--yellow)}
.fbar{height:6px;background:var(--bg);border:1px solid var(--line);margin-bottom:12px}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 8px var(--pink);width:0}
.leg{position:relative;padding:4px 0 4px 22px;border-left:2px solid var(--purple);margin-left:8px}
.leg .pt{position:relative;padding:6px 0}
.leg .pt::before{content:"";position:absolute;left:-29px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan);box-shadow:0 0 8px var(--cyan)}
.leg .pt b{font-family:var(--disp);font-size:20px}
.leg .pt span{font-size:13px;color:var(--dim);margin-left:8px}
.leg .air{font-size:12px;color:var(--purple);font-family:var(--mono);padding:4px 0}
.lay{margin:4px 0 4px 8px;padding:8px 12px;border:1px dashed var(--yellow);color:var(--yellow);font-size:12px}
.tzn{font-size:11px;color:var(--dim);margin-top:10px}

/* ---------- group switcher ---------- */
.gsel{margin-bottom:6px}
.gsel .lb{font-size:12px;color:var(--dim);margin-bottom:6px}
.gsel .opts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.gsel .opts::-webkit-scrollbar{display:none}
.gsel button{flex:none;background:none;border:1px solid var(--line);color:var(--dim);padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;border-radius:999px;text-align:left;line-height:1.3}
.gsel button small{display:block;font-size:10px;font-weight:400;opacity:.8}
.gsel button.on{color:var(--bg);background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 10px rgba(249,248,113,.6)}
.dt.off .d,.dt.off .w{opacity:.35}
.gl{display:inline-block;font-size:10px;font-weight:700;padding:0 6px;margin-left:6px;border:1px solid var(--yellow);color:var(--yellow);vertical-align:2px;font-style:normal;line-height:1.6}
.away{text-align:center;padding:26px 10px;color:var(--dim)}
.away b{display:block;font-size:30px;margin-bottom:6px}

/* ---------- cover ---------- */
.cover{position:relative;width:100%;height:100vh;height:100svh;min-height:520px;background:var(--bg);overflow:hidden;transition:opacity .45s ease,transform .5s ease}
.cover.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.cover #heroArt{position:absolute;inset:0;aspect-ratio:auto;max-height:none}
.cover #heroArt img,.cover #heroArt svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cover .shade{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,transparent,rgba(7,6,15,.75) 40%,var(--bg) 85%);pointer-events:none}
.cover .txt{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));text-align:center;padding:0 16px}
.enter{margin-top:22px;background:none;border:2px solid var(--cyan);color:#fff;font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.3em;padding:12px 34px 10px 40px;cursor:pointer;clip-path:var(--cut);background:rgba(5,217,232,.12);box-shadow:inset 0 0 18px rgba(5,217,232,.4);animation:breathe 2.2s ease-in-out infinite;font-style:italic}
.enter span{display:block;font-family:var(--body);font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--cyan);font-style:normal;margin-top:2px}
@keyframes breathe{0%,100%{box-shadow:inset 0 0 14px rgba(5,217,232,.35),0 0 0 rgba(5,217,232,0)}50%{box-shadow:inset 0 0 22px rgba(5,217,232,.6),0 0 24px rgba(5,217,232,.6)}}

/* ---------- pages ---------- */
.app{display:none;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.app.on{display:block;animation:appin .45s ease}
@keyframes appin{from{opacity:0}to{opacity:1}}
.page{display:none}
.page.on{display:block}
@keyframes pg{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page .wrap{padding-top:18px}
.banner{position:relative;height:calc(158px + env(safe-area-inset-top));border-bottom:1px solid rgba(5,217,232,.35);box-shadow:0 1px 12px rgba(5,217,232,.18);overflow:visible;z-index:1}
.bimg{position:absolute;inset:0;background:var(--bg2) var(--bimg,var(--img)) var(--bp)/var(--bs,230% auto) no-repeat;overflow:hidden}
.banner::before{content:"";position:absolute;left:0;right:0;top:-300px;height:300px;background:#0a0716}
.bimg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,6,15,.78) 0,rgba(7,6,15,.25) 50%,transparent 100%),linear-gradient(0deg,var(--bg) 0,rgba(7,6,15,.1) 35%,transparent 60%),linear-gradient(180deg,rgba(7,6,15,.45) 0,transparent 25%)}
.bimg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.bscan{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;pointer-events:none}
.bscan::before{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;background:linear-gradient(180deg,transparent,rgba(5,217,232,.16),transparent);animation:bscan 4.5s linear infinite}
@keyframes bscan{to{top:100%}}
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;left:18px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--cyan);letter-spacing:.12em;text-shadow:0 0 6px var(--cyan);z-index:1}
.hud i{flex:1;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);opacity:.6}
.hud b{font-weight:400;color:var(--yellow);text-shadow:0 0 6px var(--yellow)}
.bt{position:absolute;left:18px;right:18px;bottom:14px;z-index:1}
.bt small{display:inline-block;font-weight:900;letter-spacing:.15em;font-size:11px;padding:2px 10px;background:var(--pink);color:var(--bg);transform:skewX(-12deg);box-shadow:0 0 10px rgba(255,42,109,.6)}
.bt h2{position:relative;display:inline-block;font-size:30px;font-weight:900;font-style:italic;transform:skewX(-6deg);text-shadow:3px 3px 0 var(--pink),0 0 18px rgba(255,42,109,.6);margin-top:4px;line-height:1.15;color:#fff}
.bt h2::after{content:attr(data-t);position:absolute;left:0;top:0;color:var(--cyan);clip-path:inset(0 0 65% 0);transform:translate(-2px,0);opacity:0;animation:gl1 4s infinite steps(1);text-shadow:none}
.bs{font-size:12px;color:var(--text);margin-top:6px;display:flex;align-items:center;gap:8px;min-height:18px}
.bs .pg{flex:1;max-width:160px;height:5px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.bs .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 6px var(--pink)}
.bs b{color:var(--yellow);font-family:var(--mono)}
.page.on>.wrap{animation:pg .35s ease}
.page.on{animation:none}
.page .wrap{position:relative;z-index:2}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:150;width:min(calc(100% - 20px),480px);height:60px;display:flex;align-items:center;padding:0 5px;border-radius:30px;background:rgba(14,10,32,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(5,217,232,.45);box-shadow:0 0 16px rgba(5,217,232,.22),0 6px 20px rgba(0,0,0,.6),inset 0 0 10px rgba(185,103,255,.16);transition:width .35s cubic-bezier(.3,.7,.3,1),height .35s cubic-bezier(.3,.7,.3,1),bottom .35s,border-radius .35s}
.tabbar button{flex:1;height:52px;background:none;border:0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--dim);font-weight:900;font-size:11px;cursor:pointer;transition:height .35s,background .25s,box-shadow .25s,color .25s}
.tabbar button i{display:grid;place-items:center;width:32px;height:32px;transition:width .35s,height .35s,transform .25s,filter .25s;filter:saturate(.75) brightness(.88)}
.tabbar button i img{width:100%;height:100%;object-fit:contain}
.tabbar button i svg{width:24px;height:24px}
.tabbar button span{line-height:1.2;max-height:16px;overflow:hidden;transition:max-height .3s,opacity .25s}
.tabbar button.on{color:#fff;background:linear-gradient(160deg,rgba(255,42,109,.28),rgba(5,217,232,.18));box-shadow:inset 0 0 0 1px rgba(255,42,109,.6),0 0 12px rgba(255,42,109,.3)}
.tabbar button.on i{transform:translateY(-1px) scale(1.12) rotate(-5deg);filter:drop-shadow(0 0 5px rgba(255,42,109,.7))}
.tabbar button:active i{transform:scale(.9)}

.ckrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(255,255,255,.05)}
.ckrow label{flex:1;border:0!important}
.ckrow .x{opacity:.5;font-size:14px;padding:6px 8px}
.ckrow .x:active{opacity:1;color:var(--pink)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .in{flex:1;padding:8px 10px;font-size:15px}
.pax{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:10px;font-size:12px}
.pax .pl{color:var(--dim);font-family:var(--mono);font-size:11px;margin-right:2px}
.pax .pn{padding:1px 9px;border:1px solid var(--c,var(--cyan));color:var(--text);border-radius:999px;background:color-mix(in srgb,var(--c,var(--cyan)) 12%,transparent)}
.pax .pn.me{background:var(--c,var(--cyan));color:var(--bg);font-weight:900}
.pax .none{color:var(--dim)}
/* ---------- install hint & taxi card ---------- */
.inst{display:flex;gap:12px;align-items:flex-start}
.inst img{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:0 0 10px rgba(5,217,232,.5)}
.inst b{display:block;margin-bottom:2px}
.inst p{font-size:13px;color:var(--dim);line-height:1.6}
.inst .x{margin-left:auto;flex:none}
.taxis{display:grid;gap:8px}
.taxis .btn{justify-content:flex-start;text-align:left}
.driver{background:#fff;color:#111;padding:22px 20px 26px;border-top:6px solid var(--pink)}
.driver .lead{font-size:20px;font-weight:900;letter-spacing:.04em}
.driver .zh{font-size:12px;color:#666;margin-top:2px}
.driver .nm{font-size:30px;font-weight:900;line-height:1.3;margin:18px 0 6px}
.driver .zip{font-size:16px;color:#444;font-family:var(--mono)}
.driver .ad{font-size:24px;font-weight:700;line-height:1.5;margin-top:2px}
.driver .nt{font-size:18px;margin-top:12px;padding:10px 12px;background:#f3f3f3;border-left:4px solid var(--pink)}
.driver .tel{display:block;font-size:20px;margin-top:12px;color:#06c;font-weight:700}
.driver .row2{margin-top:18px}
.driver .btn{--c:#111;color:#111}
.driver .xx{width:auto;height:auto;margin-left:0;font-size:12px;border:1.5px solid #111}
.sheet.white{background:#fff;border-top:0;padding:0;box-shadow:none}
/* ---------- login gate ---------- */
.gate{position:absolute;inset:0;z-index:5;display:none;align-items:flex-end;justify-content:center;padding:0 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,6,15,.2),rgba(7,6,15,.85) 45%,rgba(7,6,15,.97));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.gate.on{display:flex;animation:appin .35s ease}
.gate .card{width:100%;max-width:460px;margin:0}
.gate .gh{font-family:var(--disp);font-size:12px;letter-spacing:.3em;color:var(--cyan);text-align:center;margin-bottom:8px;text-shadow:0 0 6px var(--cyan)}
/* ---------- home ---------- */
.hgrid{display:grid;gap:12px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{margin:0!important}
.hc h4{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.hdate{display:flex;align-items:flex-end;gap:12px}
.hdate .dd{font-family:var(--disp);font-size:40px;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 14px rgba(5,217,232,.7)}
.hdate .dw{font-size:14px;color:var(--cyan);font-weight:700}
.hdate .ds{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
.hdate .ds b{display:block;font-family:var(--disp);font-size:22px;color:var(--yellow);text-shadow:0 0 8px var(--yellow)}
.next{display:flex;gap:12px;align-items:center}
.next .nt{flex:1;min-width:0}
.next .nt b{display:block;font-size:16px;line-height:1.35}
.next .nt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.next .cd{font-family:var(--disp);font-size:24px;color:var(--pink);text-shadow:0 0 10px var(--pink);text-align:right;line-height:1.1;flex:none}
.next .cd small{display:block;font-family:var(--body);font-size:11px;color:var(--dim);text-shadow:none}
.mini-tl{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.mini-tl div{display:flex;gap:10px;font-size:13px;padding:3px 0;color:var(--text)}
.mini-tl div span{font-family:var(--mono);color:var(--dim);width:42px;flex:none}
.mini-tl div.past{opacity:.4}
.mini-tl div.now{color:var(--yellow)}
.wx{display:flex;align-items:center;gap:8px}
.wx .ic{font-size:30px;line-height:1}
.wx .tp{font-family:var(--disp);font-size:24px;font-weight:700}
.wx small{display:block;font-size:11px;color:var(--dim)}
.wxd{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.wxd div{flex:1;min-width:44px;text-align:center;font-size:11px;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line);padding:4px 2px}
.wxd div b{display:block;font-size:16px;margin:1px 0}
.wxd div i{font-style:normal;color:var(--text)}
.fx-rate .big{font-size:26px}
.conv{display:flex;align-items:center;gap:8px;margin-top:8px}
.conv .in{flex:1;padding:8px 10px;font-size:16px;font-family:var(--mono)}
.conv span{font-family:var(--mono);color:var(--yellow);white-space:nowrap}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.kv:last-child{border:0}
.kv b{font-family:var(--mono);color:var(--yellow)}
.chip,.pax .pn,.who b,.bal span:first-child,.settle span{max-width:100%;overflow-wrap:anywhere;word-break:break-word}
/* ---------- 済 hanko ---------- */
.hanko{flex:none;display:grid;place-items:center;width:30px;height:30px;border:2px solid #e8383d;border-radius:50%;color:#e8383d;font-style:normal;font-weight:900;font-size:15px;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;transform:rotate(-14deg);opacity:.92;box-shadow:inset 0 0 0 1.5px rgba(232,56,61,.35);text-shadow:0 0 1px #e8383d;background:radial-gradient(circle,rgba(232,56,61,.08),transparent 70%)}
.hanko.pop{animation:hanko .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes hanko{0%{transform:scale(2.4) rotate(-30deg);opacity:0}55%{transform:scale(.9) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-14deg)}}
/* ---------- 暖簾 noren ---------- */
.noren{position:relative;display:flex;align-items:center;gap:10px;margin:-14px -16px 12px;padding:12px 16px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--nc,#1b2b66) 85%,#000),var(--nc,#1b2b66));color:#fff;font-size:15px;font-weight:900;letter-spacing:.18em;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,repeating-linear-gradient(90deg,#000 0 calc(25% - 3px),transparent calc(25% - 3px) 25%) bottom/100% 12px no-repeat;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,repeating-linear-gradient(90deg,#000 0 calc(25% - 3px),transparent calc(25% - 3px) 25%) bottom/100% 12px no-repeat}
.noren::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#5a3a22,#8a5a34,#5a3a22)}
.noren .mon{display:grid;place-items:center;width:26px;height:26px;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;font-size:13px;letter-spacing:0;font-family:"Noto Serif JP","Hiragino Mincho ProN",serif}
.noren .prog{margin-left:auto;color:rgba(255,255,255,.8)}
.noren.solo{margin:18px 0 10px;clip-path:none}
/* ---------- 車票 ticket ---------- */
.card.ticket{background:#f4ecd6;background-image:repeating-linear-gradient(135deg,rgba(80,120,90,.06) 0 2px,transparent 2px 7px);color:#222;border:0;padding:0;box-shadow:none}
.ticket .tkh{display:flex;gap:10px;align-items:center;padding:8px 14px 6px;border-top:4px solid #c8102e;box-shadow:inset 0 2px 0 #fff,inset 0 4px 0 #1d4f91;font-size:11px;font-weight:900;letter-spacing:.12em;color:#c8102e}
.ticket .tkh span:nth-child(2){color:#1d4f91}
.ticket .tkno{margin-left:auto;font-family:var(--mono);color:#666;font-weight:400}
.ticket .top{padding:0 14px;color:#222!important}
